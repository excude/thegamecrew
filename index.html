<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스페이스 크루: 나인 행성 탐사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d16; --bg2:#121729; --bg3:#1a2038; --edge:#2a3358;
  --ink:#e9edf7; --muted:#8b93b0; --faint:#5c6489;
  --pink:#ef5da8; --blue:#4f9dff; --green:#4fd18a; --amber:#ffb54a; --gold:#d9b34a;
  --bad:#ff5c6c; --good:#4fd18a;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Space Grotesk',system-ui,sans-serif; overflow:hidden; position:fixed; inset:0; width:100%;}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
#app{position:relative;z-index:1;max-width:560px;height:100%;margin:0 auto;padding:10px 10px 8px;
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}

h1,h2,h3{font-weight:700;margin:0;}
.eyebrow{font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
  font-size:11px;color:var(--faint);}
.mono{font-family:'IBM Plex Mono',monospace;}

/* header */
header.top{display:flex;justify-content:space-between;align-items:center;
  padding:6px 4px 8px;border-bottom:1px solid var(--edge);margin-bottom:8px;flex-shrink:0;}
header.top .title{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
header.top .title small{display:block;color:var(--faint);font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;margin-top:1px;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--bg3);
  border:1px solid var(--edge);font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.ver-tag{display:inline-block;color:#3a2a0a;background:linear-gradient(90deg,var(--gold),#f0cd8a);
  font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:0;
  vertical-align:middle;padding:2px 7px;border-radius:8px;}

/* buttons */
button{font-family:'Space Grotesk',sans-serif;cursor:pointer;border-radius:10px;border:1px solid var(--edge);
  background:var(--bg3);color:var(--ink);padding:9px 16px;font-size:14px;transition:.15s;}
button:hover:not(:disabled){border-color:var(--faint);transform:translateY(-1px);}
button:disabled{opacity:.35;cursor:not-allowed;}
button.primary{background:linear-gradient(135deg,var(--blue),#2f6fdb);border:none;color:#fff;font-weight:600;}
button.ghost{background:transparent;}
button.small{padding:5px 10px;font-size:12px;}

/* mission grid */
#missionGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.mcard{background:var(--bg2);border:1px solid var(--edge);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
.mcard:hover{border-color:var(--blue);transform:translateY(-2px);}
.mcard.done{border-color:var(--green);}
.mcard.selected{border-color:var(--blue);border-width:2px;box-shadow:0 0 0 2px rgba(90,160,255,.25) inset;}
.mcard .num{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--gold);}
.mcard .tag{font-size:11px;color:var(--muted);margin-top:6px;min-height:28px;}
.mcard .tokens{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.tok{font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--bg3);border:1px solid var(--edge);
  border-radius:6px;padding:1px 5px;color:var(--amber);}
.mcard .check{float:right;color:var(--green);font-size:14px;}

/* panels */
.panel{background:var(--bg2);border:1px solid var(--edge);border-radius:14px;padding:10px;margin-bottom:8px;}
.banner{background:var(--bg3);border:1px solid var(--edge);border-left:3px solid var(--amber);
  border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-shrink:0;}
.banner b{color:var(--ink);}

/* seats layout */
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;flex-shrink:0;}
.seat{background:var(--bg2);border:1px solid var(--edge);border-radius:12px;padding:6px 4px;text-align:center;position:relative;}
.seat.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(79,157,255,.25);}
.seat.commander::before{content:"★";position:absolute;top:4px;left:6px;color:var(--gold);font-size:11px;}
.seat .name{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seat .sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);margin-top:1px;}
.seat .wins{margin-top:3px;font-size:10.5px;color:var(--muted);}
.seat .commflag{margin-top:3px;font-size:9.5px;color:var(--green);}
.seat .commflag.off{color:var(--faint);}
.seat.just-acted{animation:seatPulse .5s ease-out;}
@keyframes seatPulse{
  0%{box-shadow:0 0 0 0 rgba(240,205,138,.65);}
  100%{box-shadow:0 0 0 9px rgba(240,205,138,0);}
}

/* porthole trick zone */
.porthole{position:relative;width:100%;flex:1 1 auto;min-height:80px;max-height:170px;border-radius:18px;
  background:radial-gradient(ellipse at center,#161c34 0%,#0c1022 75%);
  border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;overflow:hidden;}
.porthole::after{content:"";position:absolute;inset:0;border-radius:18px;
  box-shadow:inset 0 0 40px rgba(79,157,255,.08);pointer-events:none;}
.trickslot{width:52px;height:74px;border-radius:8px;border:1.5px dashed var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--faint);
  font-family:'IBM Plex Mono',monospace;position:relative;}
.trickslot .who{position:absolute;bottom:-15px;font-size:9.5px;color:var(--muted);white-space:nowrap;}
.trickslot.just-played .card{animation:cardEnter .34s cubic-bezier(.22,.85,.32,1);transform-origin:top center;}
@keyframes cardEnter{
  0%{transform:translateY(-58px) scale(.92);opacity:0;}
  70%{transform:translateY(4px) scale(1.03);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}

/* cards — white/paper face like a real deck, overlapped in one row */
.card{width:44px;height:64px;border-radius:7px;background:linear-gradient(160deg,#fffdf6,#efe9d6);
  border:1px solid rgba(0,0,0,.18);box-shadow:0 3px 6px rgba(0,0,0,.45);
  display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;font-family:'IBM Plex Mono',monospace;
  font-weight:700;font-size:11px;flex:0 0 auto;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,margin .12s ease;
  position:relative;user-select:none;margin-left:-18px;}
.card:first-child{margin-left:0;}
.card.big{width:50px;height:72px;font-size:12.5px;margin-left:-20px;}
.card.big:first-child{margin-left:0;}
.card:hover:not(.disabled){transform:translateY(-10px);z-index:5;}
.card.disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed;}
.card.selected{transform:translateY(-14px);box-shadow:0 0 0 2px var(--blue),0 8px 14px rgba(0,0,0,.5);z-index:6;}
.card.hand-static{cursor:default;}
.card.hand-static:hover{transform:none;}
.card .top{align-self:flex-start;}
.card .bot{align-self:flex-end;transform:rotate(180deg);}
.card .icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;opacity:.9;}
.card.big .icon{font-size:19px;}
.card.P{color:var(--pink);}
.card.B{color:var(--blue);}
.card.G{color:#1f8a52;}
.card.Y{color:#b8860b;}
.card.R{color:#7a5a10;background:linear-gradient(160deg,#fdf3d8,#f0d98a);}
.card .taskdot{position:absolute;top:-7px;left:-7px;width:17px;height:17px;border-radius:50%;
  font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;
  border:1.5px solid var(--bg2);z-index:2;line-height:1;}
.card .taskdot.mine{background:var(--good);color:#04331c;}
.card .taskdot.other{background:var(--bad);color:#3a0a10;}
.cardback{width:30px;height:44px;border-radius:5px;background:repeating-linear-gradient(135deg,#1a2038,#1a2038 4px,#222a4a 4px,#222a4a 8px);
  border:1px solid var(--edge);margin-left:-14px;}
.cardback:first-child{margin-left:0;}
.backrow{display:flex;justify-content:center;margin-top:6px;}

/* hand — single overlapped row, no wrapping */
#handRow{display:flex;justify-content:center;align-items:flex-end;gap:0;padding:14px 0 2px;overflow:visible;}

/* tasks */
.taskrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.taskchip{background:var(--bg3);border:1px solid var(--edge);border-left:3px solid var(--edge);border-radius:10px;padding:5px 9px;
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);font-weight:600;}
.taskchip.done{opacity:.4;text-decoration:line-through;}
.taskchip .owner{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);font-weight:400;}
.comm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.comm-grid button{min-width:0;width:100%;padding:6px 2px;font-size:11px;line-height:1.3;white-space:normal;
  overflow:hidden;text-overflow:ellipsis;text-align:center;}
.taskchip.P{color:var(--pink);border-left-color:var(--pink);}
.taskchip.B{color:var(--blue);border-left-color:var(--blue);}
.taskchip.G{color:#1f8a52;border-left-color:#1f8a52;}
.taskchip.Y{color:#b8860b;border-left-color:#b8860b;}
.taskchip.R{color:var(--gold);border-left-color:var(--gold);}
button.task-pick-btn.P{color:var(--pink);border-color:var(--pink);}
button.task-pick-btn.B{color:var(--blue);border-color:var(--blue);}
button.task-pick-btn.G{color:#1f8a52;border-color:#1f8a52;}
button.task-pick-btn.Y{color:#b8860b;border-color:#b8860b;}
button.task-pick-btn.R{color:var(--gold);border-color:var(--gold);}

/* comm */
.commcard{display:inline-flex;flex-direction:column;align-items:center;gap:3px;}
.commbadge{font-size:9px;color:var(--green);font-family:'IBM Plex Mono',monospace;}

/* log */
#log{max-height:70px;overflow-y:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column-reverse;flex-shrink:0;}
#log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03);}
#log div.win{color:var(--green);}
#log div.fail{color:var(--bad);}
#log div.sys{color:var(--faint);}
#log div.specialcond{color:var(--amber);font-weight:600;border-bottom:1px solid rgba(255,181,74,.25);padding-bottom:4px;margin-bottom:2px;}


/* modal */
.modalbg{position:fixed;inset:0;background:rgba(4,6,14,.75);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--edge);border-radius:16px;padding:20px;max-width:440px;width:100%;}
.modal h3{margin-bottom:10px;}
.modal .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.modal .opts.row{flex-direction:row;justify-content:center;}
.modal-log{max-width:480px;}
.modal-log .modal-log-body{max-height:65vh;overflow-y:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
  display:flex;flex-direction:column-reverse;margin-top:6px;}
.modal-log .modal-log-body div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.modal-log .modal-log-body div.win{color:var(--green);}
.modal-log .modal-log-body div.fail{color:var(--bad);}
.modal-log .modal-log-body div.sys{color:var(--faint);}
.modal-log .modal-log-body div.specialcond{color:var(--amber);font-weight:600;border-bottom:1px solid rgba(255,181,74,.25);padding-bottom:4px;margin-bottom:2px;}
.logpanel{cursor:pointer;}
.logpanel:active{opacity:.8;}
.logpanel .eyebrow{display:flex;justify-content:space-between;align-items:center;}
.logpanel .eyebrow .tap-hint{font-size:10px;color:var(--faint);text-transform:none;letter-spacing:0;}
.modal-story{max-width:480px;}
.modal-story .story-body{max-height:50vh;overflow-y:auto;color:var(--ink);line-height:1.6;font-size:14px;
  padding-right:2px;white-space:pre-line;}
.modal-story .story-check{display:flex;align-items:center;gap:8px;margin-top:16px;
  font-size:13px;color:var(--muted);cursor:pointer;}
.modal-story .story-check input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;}
.title .mission-title-btn{cursor:pointer;border-bottom:1px dashed var(--faint);}
.title .mission-title-btn:hover{color:var(--blue);}

.footerbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--bg) 60%,transparent);
  padding:16px 14px 10px;display:flex;justify-content:center;gap:10px;z-index:20;}

.center{text-align:center;}
.flexrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}
a.back{color:var(--faint);text-decoration:none;font-size:12px;font-family:'IBM Plex Mono',monospace;}
a.back:hover{color:var(--ink);}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app"></div>

<script>
/* ============ STARFIELD ============ */
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');
  let w,h,stars=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;
    stars=Array.from({length:120},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.2,p:Math.random()*Math.PI*2,s:Math.random()*.02+.01}));}
  resize();addEventListener('resize',resize);
  function loop(t){ctx.clearRect(0,0,w,h);
    for(const s of stars){s.p+=s.s;const a=.35+.5*Math.abs(Math.sin(s.p));
      ctx.fillStyle=`rgba(200,215,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
    requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
})();

/* ============ CONSTANTS ============ */
const APP_VERSION='v0.155';
const SUITS=['P','B','G','Y'];
const SUIT_NAME={P:'분홍',B:'파랑',G:'초록',Y:'노랑',R:'로켓'};
const SUIT_ICON={P:'◆',B:'▲',G:'■',Y:'●',R:'🚀'};
const SUIT_COLOR={P:'var(--pink)',B:'var(--blue)',G:'#1f8a52',Y:'#b8860b',R:'var(--gold)'};
function suitSpan(suit,text){return `<span style="color:${SUIT_COLOR[suit]};font-weight:600;">${text}</span>`;}
function cardSpan(card){return suitSpan(card.suit,`${SUIT_ICON[card.suit]}${card.value}`);}
const PLAYERS=[
  {id:0,name:'나',isHuman:true},
  {id:1,name:'AI-리라',isHuman:false},
  {id:2,name:'AI-오리온',isHuman:false},
  {id:3,name:'AI-베가',isHuman:false},
];
const MAXTRICKS=10;

function M(id,tasks,tokens,special,commBlocked){return{id,tasks,tokens:tokens||[],special:special||null,desc:'',commBlocked:!!commBlocked};}
function S(type,params,desc){return{type,params:params||{},desc};}

const MISSIONS=[
M(1,1,[]),
M(2,2,[]),
M(3,2,['1','2']),
M(4,3,[]),
M(5,0,[],S('noWin',{},'커맨더가 지정한 대원은 이번 미션에서 트릭을 하나도 이기면 안 됩니다.')),
M(6,3,['>','>>'],null,true),
M(7,3,['Ω']),
M(8,3,['1','2','3']),
M(9,0,[],S('colorOne',{},'값이 1인 색깔 카드(로켓 제외)가 트릭을 이겨야 합니다.')),
M(10,4,[]),
M(11,4,['1'],S('noComm',{},'커맨더가 지정한 대원은 이번 미션에서 무전을 사용할 수 없습니다.')),
M(12,4,['Ω'],S('randomPass',{},'첫 트릭 후 각 대원은 오른쪽 대원에게서 무작위 카드 1장을 받습니다.')),
M(13,0,[],S('rocketsAny',{},'크루는 로켓 카드 1~4 각각으로 트릭을 이겨야 합니다 (순서 무관).')),
M(14,4,['>','>>','>>>'],null,true),
M(15,4,['1','2','3','4']),
M(16,0,[],S('noNine',{},'크루는 9로 이기는 트릭이 있으면 안 됩니다.')),
M(17,2,[],S('noNine',{},'크루는 9로 이기는 트릭이 있으면 안 됩니다.')),
M(18,5,[],S('disruption',{from:3},'3번째 트릭 전까지 무전을 사용할 수 없습니다.')),
M(19,5,['1'],S('disruption',{from:3},'3번째 트릭 전까지 무전을 사용할 수 없습니다.')),
M(20,2,[],S('assignAll',{},'커맨더가 예/아니오를 물은 뒤, 한 명에게 모든 과제를 맡깁니다.')),
M(21,5,['1','2'],null,true),
M(22,5,['>','>>','>>>','>>>>']),
M(23,5,['1','2','3']),
M(24,6,[]),
M(25,6,['>','>>'],null,true),
M(26,0,[],S('twoTricksValue1',{},'값이 1인 카드로 트릭을 두 번 이겨야 합니다.')),
M(27,3,[],S('assignAll',{},'커맨더가 예/아니오를 물은 뒤, 한 명에게 모든 과제를 맡깁니다.')),
M(28,6,['1','Ω']),
M(29,0,[],S('balance',{},'한 대원이 다른 대원보다 트릭을 2번 이상 더 이기면 안 됩니다.'),true),
M(30,6,['>','>>','>>>']),
M(31,6,['1','2','3']),
M(32,7,[]),
M(33,0,[],S('exactlyOne',{},'지정된 대원은 정확히 트릭 1번을 이겨야 하며, 로켓으로는 안 됩니다.')),
M(34,0,[],S('balanceFirstLast',{},'승수 격차 2 이상 금지 + 지정된 대원이 첫 트릭과 마지막 트릭을 이겨야 합니다.')),
M(35,7,['>','>>','>>>']),
M(36,7,['1','2']),
M(37,4,[],S('assignAll',{},'커맨더가 예/아니오를 물은 뒤, 한 명에게 모든 과제를 맡깁니다.')),
M(38,8,[],S('disruption',{from:4},'4번째 트릭 전까지 무전을 사용할 수 없습니다.')),
M(39,8,['>','>>','>>>'],null,true),
M(40,8,['1','2','3']),
M(41,0,[],S('firstLastOnly',{},'지정된 대원은 첫 트릭과 마지막 트릭만 이겨야 하며, 로켓으로는 안 됩니다.')),
M(42,9,[]),
M(43,9,[]),
M(44,0,[],S('rocketsOrder',{},'크루는 로켓 카드를 1→2→3→4 순서대로 트릭에서 이겨야 합니다.')),
M(45,9,['>','>>','>>>']),
M(46,0,[],S('allPink',{},'분홍 9를 가진 대원의 왼쪽 대원이 모든 분홍 카드 트릭을 이겨야 합니다.')),
M(47,10,[]),
M(48,3,['Ω'],S('lastInLastTrick',{},'마지막 과제(Ω)는 반드시 미션의 마지막 트릭에서 완수해야 합니다.')),
M(49,10,['>','>>','>>>']),
M(50,0,[],S('roles',{},'A는 1~4번째 트릭 중에만, B는 마지막 트릭에서만 이길 수 있습니다. (수동 판정 참고용)')),
];
/* 미션 카드 뒷면 스토리(설명서 PDF의 서사 텍스트를 한글로 옮긴 것). 게임 규칙에
   해당하는 문장은 이미 위 MISSIONS 배열의 special.desc / tasks / tokens 로 구현돼

46:'수많은 감각에 압도된 와중에도 위험에는 본능적으로 반응합니다. 도약 중 선내 주요 모듈이 갑자기 모두 꺼지자, 붉은 경고등이 당신을 몽롱한 상태에서 깨웁니다. 분홍색 9 카드를 가진 대원의 왼쪽에 앉은 대원이 모든 분홍색 카드 트릭을 이겨야 합니다. 분홍 9의 소유자를 밝히세요.',
47:'인내심이 바닥나고 있습니다. 도약은 이제 현실과 상상을 구분할 수 없는 감옥처럼 느껴집니다. 몸은 10초도 더 버틸 수 없다고 외치지만, 정신은 그 10초가 실제로 얼마나 긴 시간인지 의문을 품습니다. 함께 초를 세다가 마침내 웜홀 밖으로 튕겨져 나옵니다.',
